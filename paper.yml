name: v5 paper trading

on:
  schedule:
    - cron: "15 13 * * 1-5"   # 18:45 IST, Monday to Friday (GitHub may start it a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run paper trading
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paper_trade.py
      - name: Save results to the repository
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "No changes (holiday or data not updated yet)."
          else
            git commit -m "Paper trading update $(date -u +%F)"
            git push
          fi
